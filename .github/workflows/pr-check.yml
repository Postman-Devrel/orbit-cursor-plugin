name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an [Unreleased] changelog entry for content changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"

          # Plugin surface that a user-facing release should account for.
          # (plugin.json is intentionally excluded — the version bump is the
          # release workflow's job, not the feature PR's.)
          content="$(echo "$changed" | grep -E '^(skills/|rules/|mcp\.json)' || true)"
          if [[ -z "$content" ]]; then
            echo "No plugin content changed — no changelog entry required."
            exit 0
          fi

          echo "Plugin content changed:"
          echo "$content"

          # Extract the body of the [Unreleased] section at a given ref.
          unreleased() {
            git show "$1":CHANGELOG.md 2>/dev/null \
              | awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' \
              | sed '/^[[:space:]]*$/d' || true
          }

          base_unreleased="$(unreleased "$BASE_SHA")"
          head_unreleased="$(awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^[[:space:]]*$/d')"

          if [[ "$base_unreleased" == "$head_unreleased" ]]; then
            echo "::error::Plugin content changed but the [Unreleased] section of CHANGELOG.md was not updated."
            echo "Add an entry describing your change under '## [Unreleased]'. See RELEASING.md."
            exit 1
          fi

          echo "CHANGELOG.md [Unreleased] section updated — check passed."

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JSON files must parse and the manifest must be consistent
        run: |
          set -euo pipefail

          jq empty .cursor-plugin/plugin.json mcp.json

          name="$(jq -r '.name' .cursor-plugin/plugin.json)"
          if [[ ! "$name" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
            echo "::error::plugin.json name '$name' must be lowercase kebab-case."
            exit 1
          fi

          logo="$(jq -r '.logo // empty' .cursor-plugin/plugin.json)"
          if [[ -z "$logo" || ! -f "$logo" ]]; then
            echo "::error::plugin.json logo '$logo' is missing or not a committed file."
            exit 1
          fi

          url="$(jq -r '.mcpServers.orbit.url // empty' mcp.json)"
          if [[ -z "$url" ]]; then
            echo "::error::mcp.json must define mcpServers.orbit.url."
            exit 1
          fi

          echo "Manifests OK (name=$name, logo=$logo, mcp url=$url)."
